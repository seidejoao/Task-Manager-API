version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: taskanager-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  app:
    build: .
    container_name: taskanager-app
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/taskanager

volumes:
  mongodb_data: